services:
  redis:
    image: redis:7-alpine
    container_name: axiomlite-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: axiomlite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiomlite
      POSTGRES_USER: axiomlite
      POSTGRES_PASSWORD: axiomlite
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiomlite"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: axiomlite-app:dev
    container_name: axiomlite-web
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/configuration
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: ./configuration/.env
    environment:
      DATABASE_URL: postgres://axiomlite:axiomlite@db:5432/axiomlite
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: axiomlite-app:dev
    container_name: axiomlite-worker
    command: celery -A configuration worker -l info
    working_dir: /app/configuration
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock   # lets Celery spawn sandbox containers on the HOST daemon
    env_file: ./configuration/.env
    environment:
      DATABASE_URL: postgres://axiomlite:axiomlite@db:5432/axiomlite
      REDIS_URL: redis://redis:6379/1
    depends_on:
      web: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  tailwind:
    image: node:20-alpine
    container_name: axiomlite-tailwind
    working_dir: /app
    command: sh -c "npm install && npm run dev:css"
    volumes:
      - .:/app
  laya:
    build:
      context: ./laya
      dockerfile: Dockerfile

    container_name: shopping-website-laya

    restart: unless-stopped

    environment:
      LAYA_DEVICE: cuda
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_LOG_LEVEL: info
      HF_HOME: /home/laya/.cache/huggingface
      USE_TF: "0"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - laya-model-cache:/home/laya/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  redis-data:
  pg-data:
  laya-model-cache:
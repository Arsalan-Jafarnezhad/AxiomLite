<div class="stats shadow">
    <div class="stat">
        <div class="stat-title">Views</div>
        <div class="stat-value text-primary">{{ views }}</div>
    </div>
    <div class="stat">
        <div class="stat-title">Comments</div>
        <div class="stat-value">{{ comments }}</div>
    </div>
    <div class="stat">
        <div class="stat-title">Reading</div>
        <div class="stat-value">{{ reading_time }}m</div>
    </div>
</div>

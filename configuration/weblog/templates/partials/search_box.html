<form method="get"
      action="{% url 'weblog:search' %}"
      class="w-full md:w-auto">
    <div class="join">
        <input type="text"
               name="q"
               placeholder="Search..."
               class="input input-bordered join-item" />
        <button class="btn btn-primary join-item">
            <span class="material-symbols-rounded">search</span>
        </button>
    </div>
</form>

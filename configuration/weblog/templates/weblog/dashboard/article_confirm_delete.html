{% extends "base.html" %}
{% block content %}
    <section class="max-w-xl mx-auto">
        <div class="card bg-base-200 shadow-xl">
            <div class="card-body text-center">
                <span class="material-symbols-rounded text-error text-6xl">warning</span>
                <h1 class="text-3xl font-bold">Delete Article?</h1>
                <p class="text-base-content/70">
                    Are you sure you want to delete:
                    <strong>{{ object.title }}</strong>
                    ?
                </p>
                <form method="post" class="flex justify-center gap-3 mt-5">
                    {% csrf_token %}
                    <a href="{% url 'weblog:dashboard:articles' %}" class="btn btn-ghost">Cancel</a>
                    <button class="btn btn-error">
                        <span class="material-symbols-rounded">delete</span>
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}

<style>


    .badge-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
    }
    .badge-container {
        position: relative;
        
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: badgeEntrance 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .badge-container svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* ── Entrance ── */
    @keyframes badgeEntrance {
        0% {
            opacity: 0;
            transform: scale(0.72) translateY(24px);
            filter: blur(12px);
        }
        60% {
            opacity: 1;
            filter: blur(0);
        }
        100% {
            transform: scale(1) translateY(0);
            filter: blur(0);
        }
    }

    /* ── Continuous ambient glow pulse ── */
    @keyframes glowPulse {
        0%,
        100% {
            filter: drop-shadow(0 0 18px #0af) drop-shadow(0 0 36px #006fff55);
        }
        50% {
            filter: drop-shadow(0 0 28px #0cf) drop-shadow(0 0 54px #0af66);
        }
    }
    .badge-glow-group {
        animation: glowPulse 3.6s ease-in-out infinite;
        animation-delay: 1.4s;
    }

    /* ── Light sweep ── */
    @keyframes sweep {
        0% {
            opacity: 0;
            transform: translateX(-160%) skewX(-12deg);
        }
        20% {
            opacity: 0.55;
        }
        60% {
            opacity: 0.55;
        }
        100% {
            opacity: 0;
            transform: translateX(260%) skewX(-12deg);
        }
    }
    .sweep-layer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        pointer-events: none;
        animation: sweepOuter 4.8s ease-in-out infinite;
        animation-delay: 1.8s;
    }
    .sweep-bar {
        position: absolute;
        top: -10%;
        left: 0;
        width: 28%;
        height: 120%;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(100, 200, 255, 0.18),
            rgba(180, 240, 255, 0.32),
            rgba(100, 200, 255, 0.18),
            transparent
        );
        animation: sweep 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        animation-delay: 1.8s;
    }

    /* ── Gear rotation ── */
    @keyframes gearSpin {
        to {
            transform: rotate(360deg);
        }
    }
    .gear-group {
        transform-origin: 210px 210px;
        animation: gearSpin 22s linear infinite;
    }

    /* ── Circuit trace draw ── */
    @keyframes traceDraw {
        0% {
            stroke-dashoffset: 320;
        }
        100% {
            stroke-dashoffset: 0;
        }
    }
    .circuit-trace {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: traceDraw 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 0.8s;
    }

    /* ── Letter A fade+rise ── */
    @keyframes letterRise {
        0% {
            opacity: 0;
        }
        100% {
            opacity: 1;
        }
    }
    .letter-a {
        animation: letterRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0.6s;
        opacity: 0;
    }

    /* ── BACKEND text ── */
    @keyframes textReveal {
        0% {
            opacity: 0;
            letter-spacing: 0.4em;
        }
        100% {
            opacity: 1;
            letter-spacing: 0.22em;
        }
    }
    .backend-text {
        animation: textReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 1s;
        opacity: 0;
    }

    /* ── Hover: 3D tilt ── */
    .badge-container {
        transition: transform 0.12s ease;
        transform-style: preserve-3d;
    }
    .badge-container:hover {
        transform: perspective(700px) rotateX(-4deg) rotateY(6deg) scale(1.03);
        cursor: pointer;
    }
    .badge-container:hover .badge-glow-group {
        filter: drop-shadow(0 0 38px #0ff) drop-shadow(0 0 70px #08f88);
    }

    /* ── Dot blink ── */
    @keyframes dotBlink {
        0%,
        100% {
            opacity: 1;
        }
        50% {
            opacity: 0.3;
        }
    }
    .dot-l {
        animation: dotBlink 2.4s ease-in-out infinite;
        animation-delay: 0.2s;
    }
    .dot-r {
        animation: dotBlink 2.4s ease-in-out infinite;
        animation-delay: 1.4s;
    }

    /* ── Corner accent blink ── */
    @keyframes accentBlink {
        0%,
        100% {
            opacity: 0.7;
        }
        50% {
            opacity: 0.2;
        }
    }
    .corner-l {
        animation: accentBlink 3.2s ease-in-out infinite;
    }
    .corner-r {
        animation: accentBlink 3.2s ease-in-out infinite;
        animation-delay: 1.6s;
    }
</style>
